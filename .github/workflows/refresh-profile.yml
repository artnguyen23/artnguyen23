name: Refresh Firefly profile

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh-profile.py
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render public contribution calendar
        run: python3 scripts/refresh-profile.py
      - name: Save updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/repository-*.svg assets/contributions-*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public contribution calendar'
            git push
          fi
