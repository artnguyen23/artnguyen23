<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Lam.</title>
  <desc id="desc">It's nice to have you here. A quiet mint landscape with a little firefly.</desc>
